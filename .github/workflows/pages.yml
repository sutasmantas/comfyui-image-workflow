name: Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "printline/fixtures/campaign-radio-showcase.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble browser workstation
        run: |
          mkdir -p _site
          cp static/index.html static/app.js static/styles.css _site/
          cp printline/fixtures/campaign-radio-showcase.png _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
